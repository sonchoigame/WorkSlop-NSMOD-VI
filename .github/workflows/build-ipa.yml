name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout NSMOD repo
        uses: actions/checkout@v4

      - name: Checkout official WorkSlop v3.0
        uses: actions/checkout@v4
        with:
          repository: adnan120hz/WorkSlop-Mobile-New
          ref: v3.0
          path: upstream

      - name: Verify exact v3.0 source
        run: |
          cd upstream
          test "$(git rev-parse HEAD)" = "8c97076c9e25995df6e5aac063efc46cb4865a94"
          echo "Exact WorkSlop v3.0 source confirmed"

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Verify toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Apply Vietnamese and NSMOD patch
        run: |
          set -e
          cat payload/patch.b64.* > patch.b64
          openssl base64 -d -A -in patch.b64 -out patch.gz
          gunzip -c patch.gz > nsmod.patch
          cd upstream
          git apply --check ../nsmod.patch
          git apply ../nsmod.patch
          grep -q '@NSMOD' WorkSlop/SettingsView.swift
          test -f WorkSlop/NSMODWelcomeView.swift
          test -f WorkSlop/Assets.xcassets/TelegramIcon.imageset/telegram@2x.png
          test -f WorkSlop/Assets.xcassets/TikTokIcon.imageset/tiktok@2x.png

      - name: Harden pairing import
        run: python3 scripts/harden_pairing.py

      - name: Verify pairing importer source
        run: |
          grep -q 'allowedContentTypes: \[.item\]' upstream/WorkSlop/MainMenuView.swift
          grep -q 'NSFileCoordinator()' upstream/WorkSlop/MainMenuView.swift
          ! grep -q 'pathExtension.lowercased() == "plist"' upstream/WorkSlop/MainMenuView.swift
          echo "Pairing importer source checks: PASS"

      - name: Pairing format smoke test
        run: |
          python3 -c "import plistlib; r={'identifier':'member','private_key':b'a','public_key':b'b'}; l={'HostID':'host','SystemBUID':'buid','HostPrivateKey':b'k'}; assert plistlib.loads(plistlib.dumps(r))['identifier']; assert plistlib.loads(plistlib.dumps(l))['HostID']; print('Pairing format smoke test: PASS')"

      - name: Build idevice FFI
        run: |
          set -e
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            source "$HOME/.cargo/env"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios
          rm -rf /tmp/idevice
          git clone --depth 1 https://github.com/jkcoxson/idevice.git /tmp/idevice
          cd /tmp/idevice/ffi
          cargo build --target aarch64-apple-ios --release --no-default-features --features remote_pairing,rustcrypto --lib
          mkdir -p "$GITHUB_WORKSPACE/upstream/WorkSlop/Libs"
          cp /tmp/idevice/target/aarch64-apple-ios/release/libidevice_ffi.a "$GITHUB_WORKSPACE/upstream/WorkSlop/Libs/"

      - name: Cache AirliftFFI
        id: airlift-cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/AirliftFFI.xcframework
          key: airlift-ffi-40640c4d827aeab8d798285b57d24fcf6be070d0

      - name: Fetch AirliftFFI
        if: steps.airlift-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          rm -rf /tmp/aircard-xcframework
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Mak5er/AirCard-iOS.git /tmp/aircard-xcframework
          cd /tmp/aircard-xcframework
          git sparse-checkout set AirliftFFI.xcframework
          git checkout --quiet
          mkdir -p "$GITHUB_WORKSPACE/.ci-cache"
          rm -rf "$GITHUB_WORKSPACE/.ci-cache/AirliftFFI.xcframework"
          cp -R AirliftFFI.xcframework "$GITHUB_WORKSPACE/.ci-cache/"

      - name: Stage AirliftFFI
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upstream/WorkSlop/Frameworks"
          rm -rf "$GITHUB_WORKSPACE/upstream/WorkSlop/Frameworks/AirliftFFI.xcframework"
          cp -R "$GITHUB_WORKSPACE/.ci-cache/AirliftFFI.xcframework" "$GITHUB_WORKSPACE/upstream/WorkSlop/Frameworks/"

      - name: Generate project
        working-directory: upstream
        run: xcodegen generate

      - name: Build unsigned IPA
        working-directory: upstream
        run: |
          set -o pipefail
          xcodebuild -project WorkSlop.xcodeproj \
            -scheme WorkSlop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ${{ runner.temp }}/DerivedData \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee ${{ runner.temp }}/xcodebuild.log
          APP="${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos/WorkSlop.app"
          test -d "$APP"
          mkdir -p "${{ runner.temp }}/ipa-staging/Payload"
          cp -R "$APP" "${{ runner.temp }}/ipa-staging/Payload/"
          cd "${{ runner.temp }}/ipa-staging"
          /usr/bin/zip -qry "${{ runner.temp }}/WorkSlop-v3.0-NSMOD-VI-unsigned.ipa" Payload

      - name: Pack patched source
        run: |
          rm -rf upstream/.git
          ditto -c -k --sequesterRsrc --keepParent upstream "${{ runner.temp }}/WorkSlop-v3.0-NSMOD-VI-SOURCE.zip"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuildLog-v3.0
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WorkSlop-v3.0-NSMOD-VI-IPA
          path: ${{ runner.temp }}/WorkSlop-v3.0-NSMOD-VI-unsigned.ipa

      - name: Upload source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WorkSlop-v3.0-NSMOD-VI-SOURCE
          path: ${{ runner.temp }}/WorkSlop-v3.0-NSMOD-VI-SOURCE.zip
