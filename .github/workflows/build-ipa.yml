name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout NSMOD patch repo
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Verify toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Clone official WorkSlop v3.0 source
        run: |
          git clone --branch v3.0 --depth 1 https://github.com/adnan120hz/WorkSlop-Mobile-New.git upstream
          cd upstream
          echo "Upstream tag: $(git describe --tags --exact-match 2>/dev/null || true)"
          echo "Upstream commit: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "8c97076c9e25995df6e5aac063efc46cb4865a94"

      - name: Apply Vietnamese + NSMOD patch
        run: |
          set -e
          cat payload/patch.b64.* > patch.b64
          openssl base64 -d -A -in patch.b64 -out patch.gz
          gunzip -c patch.gz > nsmod.patch
          cd upstream
          git apply --check ../nsmod.patch
          git apply ../nsmod.patch
          git diff --stat
          grep -q '@NSMOD' WorkSlop/SettingsView.swift
          test -f WorkSlop/NSMODWelcomeView.swift
          test -f WorkSlop/Assets.xcassets/TelegramIcon.imageset/telegram@2x.png
          test -f WorkSlop/Assets.xcassets/TikTokIcon.imageset/tiktok@2x.png

      - name: Fix pairing file importer
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('upstream/WorkSlop/MainMenuView.swift')
          text = path.read_text(encoding='utf-8')

          old_type = 'allowedContentTypes: [.propertyList]'
          if old_type not in text:
              raise SystemExit('Could not find .propertyList importer filter')
          text = text.replace(old_type, 'allowedContentTypes: [.data]', 1)

          pattern = re.compile(
              r'\n\s*guard url\.pathExtension\.lowercased\(\) == "plist" else \{\n'
              r'\s*return .*?\n'
              r'\s*\}\n',
              re.S,
          )
          text, count = pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit('Could not remove extension-only pairing guard')

          path.write_text(text, encoding='utf-8')
          PY
          grep -q 'allowedContentTypes: \[.data\]' upstream/WorkSlop/MainMenuView.swift
          ! grep -q 'pathExtension.lowercased() == "plist"' upstream/WorkSlop/MainMenuView.swift

      - name: Build idevice FFI (Rust, for iOS 27 pairing)
        run: |
          set -e
          if ! command -v cargo &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            source "$HOME/.cargo/env"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios
          git clone --depth 1 https://github.com/jkcoxson/idevice.git /tmp/idevice
          cd /tmp/idevice/ffi
          cargo build --target aarch64-apple-ios --release \
            --no-default-features --features remote_pairing,rustcrypto --lib
          mkdir -p "$GITHUB_WORKSPACE/upstream/WorkSlop/Libs"
          cp /tmp/idevice/target/aarch64-apple-ios/release/libidevice_ffi.a \
             "$GITHUB_WORKSPACE/upstream/WorkSlop/Libs/"

      - name: Cache AirliftFFI.xcframework
        id: airlift-cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/AirliftFFI.xcframework
          key: airlift-ffi-40640c4d827aeab8d798285b57d24fcf6be070d0

      - name: Fetch AirliftFFI.xcframework
        if: steps.airlift-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          rm -rf /tmp/aircard-xcframework
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/Mak5er/AirCard-iOS.git /tmp/aircard-xcframework
          cd /tmp/aircard-xcframework
          git sparse-checkout set AirliftFFI.xcframework
          git checkout --quiet
          mkdir -p "$GITHUB_WORKSPACE/.ci-cache"
          rm -rf "$GITHUB_WORKSPACE/.ci-cache/AirliftFFI.xcframework"
          cp -R AirliftFFI.xcframework "$GITHUB_WORKSPACE/.ci-cache/"

      - name: Stage AirliftFFI
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upstream/WorkSlop/Frameworks"
          rm -rf "$GITHUB_WORKSPACE/upstream/WorkSlop/Frameworks/AirliftFFI.xcframework"
          cp -R "$GITHUB_WORKSPACE/.ci-cache/AirliftFFI.xcframework" \
                "$GITHUB_WORKSPACE/upstream/WorkSlop/Frameworks/"

      - name: Generate project
        working-directory: upstream
        run: xcodegen generate

      - name: Build unsigned IPA
        working-directory: upstream
        run: |
          set -o pipefail
          xcodebuild -project WorkSlop.xcodeproj \
            -scheme WorkSlop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ${{ runner.temp }}/DerivedData \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee ${{ runner.temp }}/xcodebuild.log

          APP="${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos/WorkSlop.app"
          test -d "$APP"
          IPA_DIR="${{ runner.temp }}/ipa-staging"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP" "$IPA_DIR/Payload/"
          (cd "$IPA_DIR" && /usr/bin/zip -qry "${{ runner.temp }}/WorkSlop-v3.0-NSMOD-VI-unsigned.ipa" Payload)
          ls -lh "${{ runner.temp }}/WorkSlop-v3.0-NSMOD-VI-unsigned.ipa"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuildLog-v3.0
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WorkSlop-v3.0-NSMOD-VI-IPA
          path: ${{ runner.temp }}/WorkSlop-v3.0-NSMOD-VI-unsigned.ipa
          if-no-files-found: warn
